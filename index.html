<!DOCTYPE html>
<html lang="th">
	<head>
		<meta charset="UTF-8">
		<title>กราฟระดับน้ำสถานีบางปะกง - คลังข้อมูลน้ำ (Realtime)</title>
		<!-- Highcharts & Tailwind CSS -->
		<script src="https://code.highcharts.com/highcharts.js"></script>
		<script src="https://code.highcharts.com/modules/accessibility.js"></script>
		<script src="https://cdn.tailwindcss.com"></script>
		<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
		<style>
			body { font-family: 'Prompt', sans-serif; background-color: #0b1329; color: #e2e8f0; }
			.dark-card { background-color: #111c38; border: 1px solid #1e293b; }
		</style>
	</head>
	<body class="p-6">
		<div class="max-w-7xl mx-auto space-y-6">
			
			<!-- Header & Filters -->
			<div class="dark-card p-4 rounded-xl shadow-lg flex flex-wrap items-center justify-between gap-4">
				<h1 class="text-xl font-semibold text-cyan-400 flex items-center gap-2">
					📊 กราฟระดับน้ำ (สถานีบางปะกง จ.ฉะเชิงเทรา) - ข้อมูลจริงจากระบบ API
				</h1>
				<div class="flex flex-wrap items-center gap-3 text-sm">
					<div>
						<label class="block text-xs text-slate-400 mb-1">จังหวัด</label>
						<select class="bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-slate-200">
							<option>ฉะเชิงเทรา</option>
						</select>
					</div>
					<div>
						<label class="block text-xs text-slate-400 mb-1">สถานี</label>
						<select class="bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-slate-200">
							<option>BPK001 บางปะกง</option>
						</select>
					</div>
					<div class="self-end">
						<button onclick="loadWaterData()" class="bg-cyan-600 hover:bg-cyan-500 text-white px-5 py-1.5 rounded font-medium transition">รีเฟรชข้อมูล</button>
					</div>
				</div>
			</div>

			<!-- Main Chart Card -->
			<div class="dark-card p-6 rounded-xl shadow-lg">
				<div id="update-status" class="text-xs text-slate-400 mb-2 text-right">กำลังโหลดข้อมูลจริง...</div>
				<div id="waterChart" style="width:100%; height:480px;"></div>
			</div>

		</div>

		<script>
			let chart;

			function initChart(chartData = [], bankLevel = 1.665) {
				chart = Highcharts.chart('waterChart', {
					chart: {
						backgroundColor: '#111c38',
						style: { fontFamily: 'Prompt' },
						zoomType: 'x'
					},
					title: { text: null },
					xAxis: {
						type: 'datetime',
						gridLineColor: '#1e293b',
						gridLineWidth: 1,
						labels: { style: { color: '#94a3b8' } }
					},
					yAxis: [{
						title: { text: 'ระดับน้ำ (ม.รทก.)', style: { color: '#94a3b8' } },
						gridLineColor: '#1e293b',
						labels: { style: { color: '#94a3b8' } },
						plotLines: [
							{
								value: bankLevel,
								color: '#ef4444',
								dashStyle: 'Dash',
								width: 2,
								label: { text: 'ระดับตลิ่ง ' + bankLevel + ' ม.รทก.', style: { color: '#ef4444', fontWeight: 'bold' }, align: 'right' }
							},
							{
								value: -11.65,
								color: '#94a3b8',
								dashStyle: 'Dash',
								width: 2,
								label: { text: 'ระดับท้องน้ำ -11.65 ม.รทก.', style: { color: '#94a3b8' }, align: 'right' }
							}
						]
					}],
					tooltip: {
						backgroundColor: '#0b1329',
						style: { color: '#e2e8f0' },
						borderColor: '#1e293b'
					},
					legend: { enabled: false },
					series: [{
						name: 'ระดับน้ำจริง',
						type: 'area',
						color: '#38bdf8',
						fillColor: {
							linearGradient: { x1: 0, y1: 0, x2: 0, y2: 1 },
							stops: [
								[0, 'rgba(56, 189, 248, 0.4)'],
								[1, 'rgba(56, 189, 248, 0.0)']
							]
						},
						data: chartData
					}]
				});
			}

			async function loadWaterData() {
				try {
					// แทนที่ด้วย Web App URL ของ Google Apps Script ที่คุณ Deploy ไว้
					const scriptUrl = 'https://script.google.com/macros/s/AKfycbzyngOcjjki63hXgh838-Djsg6cTxi8VCUaL4FUqSEYtCKMqooaK-IoptexRA5T-TZD/exec';
					const response = await fetch(scriptUrl);
					const result = await response.json();

					document.getElementById('update-status').innerText = "อัปเดตล่าสุดจากระบบ: " + result.updated_at;

					// แปลงข้อมูลประวัติให้อยู่ในรูปแบบ Timestamp ของ Highcharts [Date.UTC(...), value]
					let formattedData = [];
					if (result.history && result.history.length > 0) {
						formattedData = result.history.map(item => {
							let d = new Date(item.time);
							return [d.getTime(), item.level];
						});
					} else {
						// กรณีไม่มีข้อมูลประวัติย้อนหลัง ให้ใส่จุดปัจจุบันจำลองไว้ป้องกันกราฟว่าง
						let now = new Date().getTime();
						formattedData = [[now, result.water_level]];
					}

					if (!chart) {
						initChart(formattedData, result.bank_level);
					} else {
						chart.series[0].setData(formattedData);
					}
				} catch (error) {
					console.error("Failed to load data:", error);
					document.getElementById('update-status').innerText = "⚠️ ไม่สามารถโหลดข้อมูลได้ กรุณาตรวจสอบ URL";
				}
			}

			// โหลดข้อมูลทันทีเมื่อเปิดหน้าเว็บ
			loadWaterData();
			// รีเฟรชข้อมูลบนเว็บทุกๆ 10 นาที
			setInterval(loadWaterData, 600000);
		</script>
	</body>
</html>
