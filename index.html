<!DOCTYPE html>
<html lang="th">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Dashboard ระดับน้ำสถานีบางปะกง (ความถี่ 10 นาที)</title>
		<script src="https://cdn.tailwindcss.com"></script>
		<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
	</head>
	<body class="bg-[#0f172a] text-slate-100 font-sans min-h-screen p-4 md:p-8">
		<div class="max-w-7xl mx-auto space-y-6">
			
			<!-- Top Cards Grid -->
			<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
				<div class="bg-[#1e293b] border border-slate-800 rounded-2xl p-5 shadow-lg">
					<span class="text-xs font-semibold uppercase tracking-wider text-slate-400">ระดับน้ำปัจจุบัน</span>
					<div class="mt-3 flex items-baseline">
						<span id="water-level" class="text-4xl font-black text-sky-400">--</span>
						<span class="ml-1.5 text-lg font-medium text-slate-300">ม.</span>
					</div>
					<div id="update-time" class="mt-2 text-xs text-slate-400">กำลังโหลด...</div>
				</div>

				<div class="bg-[#1e293b] border border-slate-800 rounded-2xl p-5 shadow-lg">
					<span class="text-xs font-semibold uppercase tracking-wider text-slate-400">ระดับขอบตลิ่ง</span>
					<div class="mt-3 flex items-baseline">
						<span id="bank-level" class="text-4xl font-black text-amber-400">--</span>
						<span class="ml-1.5 text-lg font-medium text-slate-300">ม.</span>
					</div>
					<div class="mt-2 text-xs text-slate-400">เกณฑ์ล้นตลิ่ง (ม.รทก.)</div>
				</div>

				<div class="bg-[#1e293b] border border-slate-800 rounded-2xl p-5 shadow-lg">
					<span class="text-xs font-semibold uppercase tracking-wider text-slate-400">ระยะคงเหลือถึงตลิ่ง</span>
					<div class="mt-3 flex items-baseline">
						<span id="remaining-level" class="text-4xl font-black text-emerald-400">--</span>
						<span class="ml-1.5 text-lg font-medium text-slate-300">ม.</span>
					</div>
					<div id="remaining-desc" class="mt-2 text-xs text-emerald-400">กำลังโหลด...</div>
				</div>

				<div class="bg-[#1e293b] border border-slate-800 rounded-2xl p-5 shadow-lg">
					<span class="text-xs font-semibold uppercase tracking-wider text-slate-400">สถานะเตือนภัย</span>
					<div class="mt-3">
						<span id="status-badge" class="inline-flex items-center px-3 py-1 rounded-lg text-lg font-bold bg-slate-500/20 text-slate-300 border border-slate-500/30">
							กำลังโหลด...
						</span>
					</div>
					<div class="mt-2 text-xs text-slate-400">เกณฑ์เตือน: น้อยกว่า 0.30 ม.</div>
				</div>
			</div>

			<!-- Chart Section -->
			<div class="bg-[#1e293b] border border-slate-800 rounded-2xl p-6 shadow-lg">
				<div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
					<div>
						<h2 class="text-lg font-bold flex items-center gap-2">
							<span>📈</span> สถานีบางปะกง - กราฟความถี่ทุก 10 นาที
						</h2>
						<p class="text-xs text-slate-400 mt-0.5">แสดงข้อมูลระดับน้ำอัปเดตต่อเนื่องแบบเรียลไทม์</p>
					</div>
					<div class="bg-emerald-500/10 border border-emerald-500/20 px-3 py-1.5 rounded-full text-xs text-emerald-400 font-medium flex items-center gap-1.5">
						<span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> โหมด: 10-Min Interval
					</div>
				</div>
				
				<div class="relative h-[350px] w-full">
					<canvas id="waterChart"></canvas>
				</div>
			</div>
		</div>

		<script>
			const ctx = document.getElementById('waterChart').getContext('2d');
			const waterChart = new Chart(ctx, {
				type: 'line',
				data: {
					labels: [],
					datasets: [{
						label: 'ระดับน้ำจริง (ม.รทก.)',
						data: [],
						borderColor: '#06b6d4',
						backgroundColor: 'rgba(6, 182, 212, 0.1)',
						borderWidth: 3,
						pointBackgroundColor: '#06b6d4',
						pointRadius: 3,
						tension: 0.3,
						fill: true
					}]
				},
				options: {
					responsive: true,
					maintainAspectRatio: false,
					scales: {
						x: { grid: { color: '#1e293b' }, ticks: { color: '#64748b', maxTicksLimit: 12 } },
						y: { grid: { color: '#334155' }, ticks: { color: '#64748b' } }
					}
				}
			});

			async function fetchRealtimeData() {
				try {
					const res = await fetch('https://script.google.com/macros/s/AKfycbyTyQBLhSd5I9w6q9s4NOj-cMFhgHeVv5U0W-6oqNvUlcSz092jdJrSw9a6iQ_dBD9F/exec');
					const data = await res.json();
					
					document.getElementById('water-level').innerText = data.water_level;
					document.getElementById('bank-level').innerText = data.bank_level;
					document.getElementById('remaining-level').innerText = data.remaining;
					document.getElementById('update-time').innerText = "อัปเดตล่าสุด: " + data.updated_at;

					const badge = document.getElementById('status-badge');
					const remDesc = document.getElementById('remaining-desc');

					// เช็คเงื่อนไขเตือนภัย < 0.30 ม.
					if (parseFloat(data.remaining) < 0.30) {
						badge.className = "inline-flex items-center px-3 py-1 rounded-lg text-lg font-bold bg-rose-500/20 text-rose-400 border border-rose-500/30";
						badge.innerText = "🚨 วิกฤต (<0.3ม.)";
						remDesc.className = "mt-2 text-xs text-rose-400";
						remDesc.innerText = "🚨 ใกล้ล้นตลิ่งมาก ต้องเฝ้าระวังด่วน";
					} else {
						badge.className = "inline-flex items-center px-3 py-1 rounded-lg text-lg font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
						badge.innerText = "✅ ปกติ";
						remDesc.className = "mt-2 text-xs text-emerald-400";
						remDesc.innerText = "✅ อยู่ในเกณฑ์ปลอดภัย (>0.30ม.)";
					}

					if (data.chart_labels && data.chart_data) {
						waterChart.data.labels = data.chart_labels;
						waterChart.data.datasets[0].data = data.chart_data;
						waterChart.update();
					}
				} catch (e) {
					console.error("Fetch error:", e);
				}
			}

			fetchRealtimeData();
			setInterval(fetchRealtimeData, 600000); // รีเฟรชหน้าเว็บทุก 10 นาที (600,000 มิลลิวินาที)
		</script>
	</body>
</html>
