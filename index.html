<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายงานน้ำท่วม จังหวัดชัยภูมิ</title>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; }
    #map { width: 100vw; height: 100vh; cursor: crosshair; }
    .header-box {
      position: absolute; top: 10px; left: 10px; z-index: 1000;
      background: rgba(255, 255, 255, 0.95); padding: 14px 18px;
      border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      max-width: 290px;
    }
    .btn-report {
      margin-top: 10px; background: #e53e3e; color: white; border: none;
      padding: 10px 14px; border-radius: 6px; cursor: pointer; width: 100%;
      font-weight: bold; font-size: 14px;
    }
    .btn-report.active {
      background: #2b6cb0;
    }
    .instruction-note {
      font-size: 11px; color: #d69e2e; margin-top: 6px; font-weight: bold; display: none;
    }
  </style>
</head>
<body>

  <div class="header-box">
    <h3 style="margin:0; color: #2d3748;">รายงานน้ำท่วม ชัยภูมิ</h3>
    <p style="margin:4px 0 0; font-size: 12px; color: #718096;">ระบบติดตามและแจ้งเหตุบนแผนที่</p>
    <button id="reportBtn" class="btn-report" onclick="toggleReportMode()">+ แจ้งจุดน้ำท่วม (กดเพื่อปักหมุด)</button>
    <div id="instructionNote" class="instruction-note">👉 แตะ/คลิก บนจุดเกิดเหตุในแผนที่ได้เลย</div>
  </div>

  <div id="map"></div>

  <script>
    // -------------------------------------------------------------
    // 1. นำ URL จาก Google Apps Script มาวางที่นี่
    // -------------------------------------------------------------
    const GOOGLE_SHEET_API = "https://script.google.com/macros/s/AKfycbwpGvzpeLK_YpQl3-mg6NDa3aMgTdnJJ51mQhZXb1uBGD07T-1c1lUJ9X3rwG2vSZR8/exec";

    let isReportMode = false;

    // ตั้งค่าแผนที่เริ่มต้นที่ จ.ชัยภูมิ
    const map = L.map('map').setView([15.8064, 102.0315], 9);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // -------------------------------------------------------------
    // 2. ดึงเส้นขอบเขตจังหวัดชัยภูมิ (ปรับเป็น เส้นสีดำ หนาชัดเจน)
    // -------------------------------------------------------------
    fetch('https://raw.githubusercontent.com/apisit/thailand-geojson/master/chaiyaphum.json')
      .then(response => response.json())
      .then(geoData => {
        const boundaryLayer = L.geoJSON(geoData, {
          style: {
            color: '#000000',      // สีเส้นขอบเขต (สีดำ)
            weight: 4,             // ความหนาของเส้น
            opacity: 0.9,          // ความชัดเจนของเส้น
            fillColor: '#3182ce',  // สีไฮไลท์พื้นที่ด้านใน
            fillOpacity: 0.05      // โปร่งแสงด้านใน
          }
        }).addTo(map);

        // ปรับโฟกัสแผนที่ให้อยู่ในขอบเขตจังหวัดชัยภูมิโดยอัตโนมัติ
        map.fitBounds(boundaryLayer.getBounds());
      })
      .catch(err => console.log('ไม่สามารถโหลดเส้นขอบเขตได้:', err));

    // -------------------------------------------------------------
    // 3. ฟังก์ชันดึงข้อมูลจาก Google Sheets มาแสดง
    // -------------------------------------------------------------
    async function loadData() {
      if (!GOOGLE_SHEET_API || GOOGLE_SHEET_API.includes("วาง_WEB_APP_URL")) return;

      try {
        const response = await fetch(GOOGLE_SHEET_API);
        const data = await response.json();

        data.forEach(item => {
          if (item.latitude && item.longitude) {
            let color = "orange";
            if (item.water_level === "สูง" || item.water_level === "วิกฤต") color = "red";
            if (item.water_level === "ต่ำ") color = "gold";

            const marker = L.circleMarker([parseFloat(item.latitude), parseFloat(item.longitude)], {
              color: color, fillColor: color, fillOpacity: 0.8, radius: 9
            }).addTo(map);

            marker.bindPopup(`
              <div style="font-size:13px;">
                <b>สถานที่:</b> ${item.location_name || 'จุดแจ้งเหตุบนแผนที่'}<br>
                <b>ระดับน้ำ:</b> ${item.water_level || '-'}<br>
                <b>รายละเอียด:</b> ${item.description || '-'}<br>
                <small style="color:#666;">พิกัด: ${parseFloat(item.latitude).toFixed(4)}, ${parseFloat(item.longitude).toFixed(4)}</small><br>
                <small style="color:#666;">เวลา: ${item.timestamp ? new Date(item.timestamp).toLocaleString('th-TH') : '-'}</small>
              </div>
            `);
          }
        });
      } catch (err) {
        console.error("เกิดข้อผิดพลาดในการโหลดข้อมูล:", err);
      }
    }

    // -------------------------------------------------------------
    // 4. ระบบกดเปิดโหมดแจ้งเหตุแล้วจิ้มบนแผนที่
    // -------------------------------------------------------------
    function toggleReportMode() {
      isReportMode = !isReportMode;
      const btn = document.getElementById("reportBtn");
      const note = document.getElementById("instructionNote");

      if (isReportMode) {
        btn.innerText = "❌ ยกเลิกการเลือกจุด";
        btn.classList.add("active");
        note.style.display = "block";
      } else {
        btn.innerText = "+ แจ้งจุดน้ำท่วม (กดเพื่อปักหมุด)";
        btn.classList.remove("active");
        note.style.display = "none";
      }
    }

    // เมื่อคลิก/จิ้มบนแผนที่
    map.on('click', async function(e) {
      if (!isReportMode) return; // ถ้าไม่ได้เปิดโหมดแจ้งเหตุจะไม่ทำงาน

      const lat = e.latlng.lat;
      const lng = e.latlng.lng;

      // ถามรายละเอียดเพิ่มเติม
      const waterLevel = prompt("ระบุระดับน้ำ (เช่น: ต่ำ / ปานกลาง / สูง / รถเล็กผ่านไม่ได้):", "ปานกลาง");
      if (!waterLevel) return;

      const locationName = prompt("ชื่อสถานที่/จุดสังเกตใกล้เคียง (ถ้ามี):", "จุดปักหมุดบนแผนที่");
      const description = prompt("รายละเอียดเพิ่มเติม (ถ้ามี):", "");

      const payload = {
        location_name: locationName,
        latitude: lat,
        longitude: lng,
        water_level: waterLevel,
        description: description
      };

      try {
        // ส่งข้อมูลเข้า Google Sheets
        await fetch(GOOGLE_SHEET_API, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        alert("ปักหมุดและบันทึกข้อมูลเรียบร้อยแล้ว!");
        toggleReportMode(); // ปิดโหมดปักหมุด
        setTimeout(loadData, 1500); // โหลดหมุดใหม่ขึ้นแผนที่
      } catch (err) {
        alert("เกิดข้อผิดพลาดในการส่งข้อมูล");
      }
    });

    // โหลดข้อมูลเมื่อเปิดหน้าเว็บ
    loadData();
  </script>
</body>
</html>
